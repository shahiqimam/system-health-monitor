name: pulsewatch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pulsewatch_pgdata:/var/lib/postgresql/data
    # Published so local development and the e2e suite can reach the database
    # from the host. Containers still resolve it as "postgres" on the bridge
    # network, never as localhost.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pulsewatch]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # Inside the Compose network the database host is the service name,
      # never localhost (see docs/TROUBLESHOOTING.md).
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-pulsewatch}
      DATABASE_USER: ${POSTGRES_USER:-pulsewatch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-replace_with_long_random_value}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Swagger is served for the portfolio demo; disable it for a real deployment.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
      MAX_CONCURRENT_CHECKS: ${MAX_CONCURRENT_CHECKS:-10}
      DEFAULT_CHECK_INTERVAL_SECONDS: ${DEFAULT_CHECK_INTERVAL_SECONDS:-60}
      MIN_CHECK_INTERVAL_SECONDS: ${MIN_CHECK_INTERVAL_SECONDS:-15}
      DEFAULT_TIMEOUT_MS: ${DEFAULT_TIMEOUT_MS:-5000}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-3}
      RECOVERY_THRESHOLD: ${RECOVERY_THRESHOLD:-2}
      CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-30}
      # Secure default. The demo profile overrides this on purpose.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [pulsewatch]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks: [pulsewatch]

  # --- Demo fixtures (profile: demo) -------------------------------------
  # Tiny deterministic endpoints so the demo does not depend on the internet.
  demo-healthy:
    image: node:22-alpine
    profiles: [demo]
    restart: unless-stopped
    command: ['node', '/app/healthy.js']
    environment:
      PORT: 8081
    volumes:
      - ./demo-services:/app:ro
    ports:
      - '8081:8081'
    networks: [pulsewatch]

  demo-flaky:
    image: node:22-alpine
    profiles: [demo]
    restart: unless-stopped
    command: ['node', '/app/flaky.js']
    environment:
      PORT: 8082
    volumes:
      - ./demo-services:/app:ro
    ports:
      - '8082:8082'
    networks: [pulsewatch]

volumes:
  pulsewatch_pgdata:

networks:
  pulsewatch:
    driver: bridge
